name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun install --cwd spacetimedb --frozen-lockfile
      - run: echo "Tests skipped"
      - run: bun run build
      - run: bun run typecheck:module
      - name: Copy build to docs
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll
      - name: Commit and Push docs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m "Auto-deploy to docs" || exit 0
          git push
